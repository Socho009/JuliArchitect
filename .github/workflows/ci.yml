name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.9'
      - name: Install dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Run unit tests
        run: julia --project -e 'using Pkg; Pkg.test()'
      - name: Performance regression check
        run: julia --project scripts/test_regression.jl true
  
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.9'
      - name: Install dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Run benchmarks
        run: |
          mkdir -p results
          julia --project scripts/benchmark_full.jl train_iters=5 infer_runs=30 n_embd=64 n_layer=2 basis_dim=8 out='results/bench_ci.json' 2>&1 | tail -20
      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/bench_ci.summary
          retention-days: 90
